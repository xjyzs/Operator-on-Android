name: 构建并发布 Release APK

on:
  workflow_dispatch:
  push:

jobs:
  build-variant:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - { flavor: "x86", task: "assembleX86Release" }
          - { flavor: "x86_64", task: "assembleX86_64Release" }
          - { flavor: "arm", task: "assembleArmRelease" }
          - { flavor: "arm64Minsdk35", task: "assembleArm64Minsdk35Release" }
          - { flavor: "arm64Minsdk29", task: "assembleArm64Minsdk29Release" }
          - { flavor: "universal", task: "assembleUniversalRelease" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 安装 GraalVM JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: 给 gradlew 添加执行权限
        run: chmod +x ./gradlew

      - name: 构建 Release APK (${{ matrix.variant.flavor }})
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError"
            -Dorg.gradle.parallel=true
            -Dorg.gradle.vfs.watch=false
        run: |
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            echo "$RELEASE_SIGNING_KEY" | base64 --decode > keystore.jks
          else
            touch keystore.jks
          fi
          ./gradlew ${{ matrix.variant.task }} --build-cache

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant.flavor }}
          path: app/build/outputs/apk/${{ matrix.variant.flavor }}/release/*.apk

  publish-release:
    needs: build-variant
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 下载所有 APK
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: apks
          merge-multiple: true

      - name: 从 build.gradle.kts 提取版本信息
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*\"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*"?\K[0-9]+' app/build.gradle.kts | head -1)
          
          SANITIZED_VERSION=$(echo "$VERSION_NAME" | sed -E 's/[[:space:]]+/-/g')
          BASE_TAG="v${SANITIZED_VERSION}"
          TAG_NAME="$BASE_TAG"

          SUFFIX=2
          while gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            TAG_NAME="${BASE_TAG}-${SUFFIX}"
            SUFFIX=$((SUFFIX + 1))
          done

          IS_PRERELEASE="false"
          if echo "$VERSION_NAME" | grep -iqE '(alpha|beta|rc|dev|preview)'; then
            IS_PRERELEASE="true"
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          body: ${{ github.event.head_commit.message }}
          files: apks/*.apk
